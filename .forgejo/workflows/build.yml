# Builds every entry in build.yaml, the same way as ZMK's build-user-config.yml (which only runs on GitHub,
# so .github/workflows/build.yml keeps using it there). One job builds them in turn, sharing one west update.
name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:stable
    env:
      base_dir: /tmp/zmk-config
    steps:
      - name: Install Node for the JavaScript actions
        run: |
          apt-get update && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash
          apt-get install -y nodejs

      - uses: actions/checkout@v4

      - name: West init and update
        run: |
          mkdir -p "$base_dir/config"
          cp -R config/* "$base_dir/config/"
          cd "$base_dir"
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build
        run: |
          workspace=$PWD
          mkdir -p "$workspace/firmware"
          python3 - <<'EOF' >"$base_dir/builds.tsv"
          import yaml
          for b in yaml.safe_load(open("build.yaml"))["include"]:
              print("\t".join(b.get(k, "") for k in ("board", "shield", "snippet", "cmake-args", "artifact-name")))
          EOF
          cd "$base_dir"
          failed=0
          while IFS=$'\t' read -r board shield snippet cmake_args artifact_name; do
            name=${artifact_name:-${shield:+$shield-}${board//\//_}-zmk}
            echo "::group::$name"
            build_dir=$(mktemp -d)
            args=(-s zmk/app -d "$build_dir" -b "$board")
            [ -n "$snippet" ] && args+=(-S "$snippet")
            cmake=(-DZMK_CONFIG="$base_dir/config" -DZMK_EXTRA_MODULES="$workspace")
            [ -n "$shield" ] && cmake+=(-DSHIELD="$shield")
            # shellcheck disable=SC2206 # cmake-args is a space-separated list
            cmake+=($cmake_args)
            if west build "${args[@]}" -- "${cmake[@]}"; then
              cp "$build_dir/zephyr/zmk.uf2" "$workspace/firmware/$name.uf2"
            else
              echo "::error::$name failed to build"
              failed=1
            fi
            echo "::endgroup::"
          done <"$base_dir/builds.tsv"
          exit $failed

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        if: always()
        with:
          name: firmware
          path: firmware/*.uf2
