# Redraws docs/keymap.png (tools/draw-keymap.py) when the keymap changes, and commits it.
name: Draw keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/info.json"
      - "tools/draw-keymap.py"

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pycairo and Noto Sans
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends python3 python3-cairo fonts-noto-core

      - name: Draw the keymap
        run: python3 tools/draw-keymap.py

      - name: Commit the picture
        run: |
          if git diff --quiet -- docs/keymap.png; then
            echo "docs/keymap.png is already up to date"
            exit 0
          fi
          git config user.name "keymap-drawer[bot]"
          git config user.email "keymap-drawer@noreply.${GITHUB_SERVER_URL#*://}"
          git commit -m "Redraw keymap [skip ci]" -- docs/keymap.png
          git push
