CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y

# Deep sleep after 30 minutes without a key press. Each half sleeps on its own; any key wakes it and it
# reconnects to the dongle. Never while USB power is connected, so the dongle stays awake.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
